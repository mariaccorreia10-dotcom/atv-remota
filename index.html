<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tela de Login</title>

  <style>
    body {
      font-family: Arial;
      background-color: #eeeeee;
    }

    .login {
      width: 300px;
      margin: 100px auto;
      padding: 25px;
      background-color: white;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      color: #1769aa;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      color: white;
      background-color: #1769aa;
      border: none;
      border-radius: 5px;
    }

    a {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #1769aa;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>Entrar</h1>

    <input type="email" placeholder="E-mail">
    <input type="password" placeholder="Senha">

    <button>Entrar</button>

    <a href="#">Esqueci minha senha</a>
  </div>

</body>
</html>
